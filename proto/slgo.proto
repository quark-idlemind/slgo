syntax = "proto3";

// Package slgo.v1 is the link between a server holding grid connections
// and the clients attached to it.
//
// The division is that the server owns whatever breaks if a client
// restarts -- the circuit, its sequence numbers, retransmission,
// acknowledgements, the login and the capability URLs -- and nothing
// else.  It does not decode message bodies, hold an inventory,
// understand chat or know what a script is.
//
// A grid message crosses as its number and its undecoded bytes, so the
// server relays a message type it has never heard of and a client can
// be restarted as often as you like without the grid noticing.
package slgo.v1;

option go_package = "github.com/quark-idlemind/slgo/proto/slgov1";

service Grid {
  // Login authenticates a caller, BOTH WAYS, before anything else is
  // accepted. Two calls of one message type; see LoginRequest.
  //
  // slgod holds a live Second Life session, so an unauthenticated one
  // reachable off this machine is an open invitation to drive somebody
  // else's avatar. The exchange is the same one slrund uses, from the
  // same package.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Stream is the packet channel.  The client sends messages to put on
  // the circuit and receives the ones it has subscribed to.  Nothing
  // that is not a grid packet belongs here.
  rpc Stream(stream ClientPacket) returns (stream ServerPacket);

  // Everything below is the server answering for itself rather than
  // relaying the grid.

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);

  // Host brings a session up that is not running, and Logout puts one
  // down and keeps it down.
  //
  // Both are deliberate acts by a person, which is why they are their
  // own methods rather than something that happens as a side effect of
  // attaching.  Logging an avatar in is visible on the grid -- an
  // arrival, a presence, a notice to whoever is watching -- and should
  // not follow from a typo in a stale config file.
  //
  // Logout is remembered.  A session that was told to stop stays
  // stopped, so that somebody using that avatar in a viewer is not
  // fighting the daemon for it, and comes back only when asked for by
  // name.
  rpc Host(HostRequest) returns (HostResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Presence reads where the avatar is and what it can see, and can
  // change the draw distance.
  //
  // Both belong to the server.  AgentUpdate is what puts a session in
  // the simulator's interest list, it has to keep being sent, and the
  // interest list is worked out from the camera rather than from where
  // the avatar is -- so a client that owned this would empty the
  // interest list for every other client by exiting.  A client can ask
  // what it is and ask for it to be changed; it cannot hold it.
  rpc Presence(PresenceRequest) returns (PresenceResponse);

  // Objects is what the region has told the session about itself.
  //
  // The server holds this for the same reason it holds the camera: a
  // region describes itself once, when the avatar arrives, and a
  // client that attaches a minute later is never told any of it.  The
  // server was there to hear it, so the server remembers.  It still
  // has no idea what any of the objects are for.
  rpc Objects(ObjectsRequest) returns (ObjectsResponse);

  // Region is what the simulator said about itself in the handshake,
  // which happens once, before any client is listening.
  rpc Region(RegionRequest) returns (RegionInfo);

  // Flush empties the object cache.
  //
  // It is done automatically when the region changes, since everything
  // cached then describes somewhere else.  This is for a client that
  // knows the cache is wrong for a reason the server cannot see.
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Cap makes an HTTP request against one of the agent's
  // capabilities.  The server holds the URLs and does the request; it
  // has no idea what any of them mean.  This is what keeps inventory,
  // asset upload and script compilation out of the server.
  rpc Cap(CapRequest) returns (CapResponse);

  // Send puts one message on the circuit without opening a stream, for
  // a client that only wants to say one thing.
  rpc Send(SendRequest) returns (SendResponse);

  // Friends is who this avatar's friends are and which of them are
  // logged in.
  //
  // The server holds this for the same reason it holds the region's
  // objects: the grid says it once, to whoever was there. The list
  // itself arrives only in the login response -- it is on no message
  // the simulator ever sends -- and online status arrives as a burst
  // of OnlineNotification seconds after the handshake, long before a
  // client can attach. Neither can be asked for again.
  rpc Friends(FriendsRequest) returns (FriendsResponse);

  // NoteFriend records a friendship the client watched being formed.
  //
  // Accepting an offer is the one case the grid never reports. The
  // side that offers is told twice -- an instant message saying so
  // and an OnlineNotification -- and the side that accepts is told
  // nothing whatsoever, because it was the one that did it. A viewer
  // has the same hole and fills it the same way, by adding the friend
  // to its own list (LLAvatarTracker::formFriendship).
  //
  // So the client, which understands what it just sent, tells the
  // server, which holds what a client restart would lose. The server
  // still decodes nothing.
  rpc NoteFriend(NoteFriendRequest) returns (NoteFriendResponse);

  // ViewerCredential mints a password a real viewer may log in with
  // ONCE, so that a session can be handed to a person without any
  // password being typed or stored anywhere.
  //
  // A call of its own rather than a field of StatusResponse because
  // asking is not free: every call makes a fresh secret and drops the
  // one before it, which is not something a client watching the
  // counters should do by accident.  Where the endpoint is and whether
  // a viewer is on it are facts and cost nothing to read, so they
  // travel in StatusResponse.viewer instead.
  rpc ViewerCredential(ViewerCredentialRequest) returns (ViewerCredentialResponse);
}

// ------------------------------------------------------------ packets

// ClientPacket is a message the client wants put on the circuit, or the
// opening frame naming the agent to attach to.
// Login is one message type used twice.
//
//   client -> server   (empty)
//   server -> client   SCHAL, 16 random bytes
//   client -> server   CCHAL, HMAC(secret, SCHAL || "CLIENT" || binding)
//   server -> client   HMAC(secret, CCHAL || "SERVER" || binding)
//
// Mutual, so neither side proceeds until the other has shown it knows
// the shared secret, and bound to the TLS session so that the whole
// exchange cannot simply be relayed by something in the middle.
//
// Success authenticates the CONNECTION. There is no token: TLS already
// made a session and this proved who is on the far end of it.
message LoginRequest {
  string client = 1;
  bytes challenge = 2;
  bytes proof = 3;
}

message LoginResponse {
  bytes challenge = 1;
  bytes proof = 2;
}

message ClientPacket {
  oneof body {
    Attach attach = 1;
    OutboundMessage message = 2;

    // Which messages to relay is state of this stream, so it is
    // adjusted on the stream rather than by an RPC that would have no
    // way to say which stream it meant.
    Subscribe subscribe = 3;

    // Asking for and giving up a lock.  On the stream for the same
    // reason: a lock belongs to the client holding it, and the stream
    // is what says which client that is -- and, more to the point,
    // when it has gone away.  A lease held by a stream is released
    // when the stream ends, whether the client exited, crashed or was
    // unplugged, and that needs no heartbeat of its own.
    Lock lock = 4;
    Unlock unlock = 5;
  }
}

// Lock asks for exclusive use of something named.
//
// The name is whatever the clients agree it is; slgod attaches no
// meaning to it and only ever compares it. "auto" is the object
// automate and autobench run their scripts in, which one client must
// have to itself: a benchmark carries its base reading in that object's
// linkset data, which belongs to the object and not to the script, so
// two runs at once would divide by each other's numbers.
message Lock {
  string name = 1;

  // Try asks for an answer now rather than a turn: held comes back
  // false if somebody else has it. Waiting is the default, because a
  // program that wants the lock almost always wants to get on with the
  // work once it has it, and the alternative it would otherwise write
  // for itself is a sleep and another ask.
  bool try = 2;
}

// Unlock gives one back.  Ending the stream does the same thing.
message Unlock {
  string name = 1;
}

// Locked answers a Lock: held says whether it is now this client's.
// For a waiting Lock it does not arrive until the lock is this
// client's, so held is true; for a trying one it comes straight back
// either way.
message Locked {
  string name = 1;
  bool held = 2;

  // Who has it, when held is false and somebody else does. It is for a
  // person to read, not to act on.
  string holder = 3;
}

// Subscribe adjusts what this stream relays.  Exactly one field is
// used: set replaces the subscription, add and remove adjust it.
message Subscribe {
  repeated string set = 1;
  repeated string add = 2;
  repeated string remove = 3;

  // Replace says set is meant, even when it is empty.
  //
  // It exists because proto3 writes an empty repeated field as no
  // field at all, so "subscribe to nothing" and "leave the
  // subscription alone" arrive identically -- which made clearing a
  // subscription a silent no-op, on exactly the connection that most
  // needs it.  A server still honours a set that has names in it
  // without this, so a client older than the field works as it always
  // did.
  bool replace = 4;
}

// Attach must be the first frame on a stream.
message Attach {
  string agent = 1;

  // Messages to relay, by template name.  "*" means everything.  Empty
  // means nothing until Subscribe says otherwise, which is the default
  // because a busy region will otherwise flood the link.
  repeated string subscribe = 2;
}

message OutboundMessage {
  // The message number, as slgo's msg.ID.  Name may be given instead
  // and is looked up in the template.
  uint32 id = 1;
  string name = 2;

  // The encoded message body, without the packet header or the message
  // number.  The server frames it: sequence numbers and reliability
  // are circuit state and are not the client's to choose.
  bytes body = 3;
  bool reliable = 4;
}

// ServerPacket is a message that arrived from the simulator, or a note
// about the connection.
message ServerPacket {
  oneof body {
    InboundMessage message = 1;
    Attached attached = 2;

    // A note about the grid connection itself: it went away, it came
    // back.  Not grid traffic.
    AgentEvent notice = 3;

    // Something that arrived on the event queue rather than the UDP
    // circuit.  Its body is LLSD, not the binary message encoding, so
    // it cannot share InboundMessage.
    InboundEvent event = 4;

    // The answer to a Lock.
    Locked locked = 5;
  }
}

// InboundEvent is one entry from EventQueueGet.
//
// The queue carries what UDP no longer does: ParcelProperties,
// TeleportFinish, EstablishAgentCommunication and the rest.  A poll
// must be kept running continuously and its sequence acknowledged, so
// it belongs on the server for the same reason the circuit does -- a
// client restart would lose the sequence and drop events.
message InboundEvent {
  // The event name, as the queue gives it.  Some match a template
  // message and some have no UDP equivalent at all.
  string message = 1;

  // The event body, LLSD encoded.  The server does not look inside.
  bytes body = 2;

  int64 received_at = 3;
}

message Attached {
  AgentInfo agent = 1;
}

message InboundMessage {
  uint32 id = 1;

  // The template's name for the message, empty when the number is not
  // in this server's template.  The body is relayed either way.
  string name = 2;

  bytes body = 3;
  uint32 sequence = 4;
  uint32 flags = 5;

  // Microseconds since the epoch, when the datagram was read.
  int64 received_at = 6;
}

// AgentEvent is something that happened to the grid connection itself.
message AgentEvent {
  enum Kind {
    UNKNOWN = 0;
    REGION_CHANGED = 1;
    DISCONNECTED = 2;
    KICKED = 3;
  }
  Kind kind = 1;
  string detail = 2;
}

// ------------------------------------------------------------ control

message AgentInfo {
  string name = 1; // the profile name the server hosts it under
  string agent_id = 2;
  string session_id = 3;
  string avatar_name = 4;
  string region = 5;
  string channel_version = 6;
  string inventory_root = 7;
  repeated string caps = 8;
  bool connected = 9;

  // State is what can be done with this agent, which is not the same
  // question as whether a circuit is up.
  //
  // The distinctions earn their keep by being different actions: a
  // CONFIGURED agent can be started, a STOPPED one deliberately should
  // not be started unless asked for by name, and a FAILED one will
  // waste a login attempt if asked too soon.  Without them, "I have
  // never heard of qi" and "qi is deliberately down" look identical,
  // and the second is not an error at all.
  enum State {
    UNKNOWN = 0;
    HOSTED = 1;      // logged in and serving
    CONNECTING = 2;  // a login is in flight
    CONFIGURED = 3;  // a profile exists; nothing has asked for it
    STOPPED = 4;     // deliberately down; do not start unasked
    FAILED = 5;      // tried and could not; see detail
  }
  State state = 10;

  // Detail says why, for the states where why is the useful part:
  // the grid's own words for a kick, or the login server's for a
  // refusal.  Meant for a person.
  string detail = 11;
}

message HostRequest {
  // Agent names the profile to bring up.  It must be named: this is
  // the one call where "whichever" cannot mean anything.
  string agent = 1;

  // Force starts one that was deliberately stopped.  Without it a
  // STOPPED agent is left alone, since something stopped it on
  // purpose -- most likely a person now using that avatar elsewhere.
  bool force = 2;
}

message HostResponse {
  AgentInfo agent = 1;

  // Already is true when it was up before the call, which makes Host
  // safe to repeat.
  bool already = 2;
}

message LogoutRequest {
  string agent = 1;

  // Force logs out even with clients attached.  Without it, a session
  // somebody is using is left alone and their names come back in the
  // error: a benchmark mid-run has a script installed and a reading
  // half-taken, and losing it should be somebody's decision.
  bool force = 2;
}

message LogoutResponse {
  // Clients is who was attached when this was refused, empty when it
  // was not refused.
  repeated string clients = 1;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message StatusRequest {
  string agent = 1;
}

message StatusResponse {
  AgentInfo agent = 1;

  uint64 packets_in = 2;
  uint64 packets_out = 3;
  uint64 bytes_in = 4;
  uint64 bytes_out = 5;
  uint64 resent = 6;
  uint64 abandoned = 7;
  uint64 duplicates = 8;
  uint64 undecodable = 9;
  uint64 unknown_messages = 10;
  int32 clients = 11;

  // Messages nobody has registered for, by template name.  This is how
  // a protocol change announces itself.
  map<string, uint64> unhandled = 12;

  // Viewer is where a real viewer would log in to take this session
  // over.  It rides with the counters because it is the same kind of
  // thing: state the daemon holds, about one agent, that a client
  // cannot work out for itself.
  ViewerEndpoint viewer = 13;
}

// ViewerEndpoint is slgod's own login server, and whether a viewer has
// come in on it.
//
// slgod can serve an XMLRPC login endpoint that hands a running session
// to a real viewer, and the address it serves on has until now appeared
// only in the daemon's log.  A person attached with a shell could not
// ask, which meant the feature was reachable only by whoever started
// the daemon and still had the terminal.
message ViewerEndpoint {
  // LoginUri is what to add to a viewer's grid list, ready to paste.
  //
  // Empty means this daemon was started WITHOUT -viewer and serves no
  // viewer logins at all -- the ordinary case, since the flag is not
  // the default.  That is a state worth naming rather than a blank
  // field: the answer to "where do I point a viewer" is then "nowhere
  // yet, restart slgod with -viewer ADDR", which a client can only say
  // if it can tell the two apart.
  string login_uri = 1;

  // Attached is whether a viewer has finished the handshake on this
  // agent's circuit.
  //
  // The daemon's own answer, and one-sided: a viewer that quits sends
  // nothing to say so, so this stays true until the next one appears.
  // It is therefore "a viewer has taken this session" rather than "a
  // viewer is at the keyboard".
  bool attached = 2;
}

message ViewerCredentialRequest {
  string agent = 1;
}

// ViewerCredentialResponse is everything a viewer needs to log in as
// this agent, and nothing that outlives the attempt.
message ViewerCredentialResponse {
  // LoginUri is the endpoint the password is good for.  It travels
  // with the password so the two cannot be paired up wrongly by a
  // client that read the address at some other moment.
  string login_uri = 1;

  // First and Last are the avatar's name, which is what a viewer's
  // login box wants -- the profile name slgod files it under means
  // nothing to a viewer.
  string first = 2;
  string last = 3;

  // Password is plaintext, good for ONE login and for a minute or so.
  //
  // It is generated by the daemon and never stored: what the daemon
  // keeps is its digest, which is discarded the moment a login matches
  // it.  A profile stores viewer_password as a "$1$" md5 digest, so
  // nothing outside slgod can produce a password a viewer could hash
  // into a match -- minting one here is what replaces asking a person
  // for a secret they have no way of knowing.
  //
  // Whoever receives this hands it to a viewer, which means it reaches
  // a command line.  Single use and a short life are what make that
  // acceptable; see the caller.
  string password = 4;

  // ExpirySeconds is how long the password is good for, so a client
  // can say so rather than guessing.
  int32 expiry_seconds = 5;
}

message CapRequest {
  string agent = 1;
  string cap = 2;    // capability name, e.g. "InventoryAPIv3"
  string method = 3; // default GET
  string path = 4;   // appended to the capability URL
  bytes body = 5;
  string content_type = 6;

  // An absolute URL to use instead of a named capability.
  //
  // Asset upload needs this: the first step posts to a capability and
  // the simulator answers with a one-shot uploader URL to post the
  // bytes to.  Without it a client would have to reach the simulator
  // itself, which is exactly the coupling the server exists to avoid.
  //
  // Only URLs the simulator has handed us are accepted, so this cannot
  // be used to make the server fetch something arbitrary.
  string url = 7;
}

message CapResponse {
  int32 status = 1;
  bytes body = 2;
}

message SendRequest {
  string agent = 1;
  OutboundMessage message = 2;
}

message SendResponse {}

// ------------------------------------------------------------ presence

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PresenceRequest {
  string agent = 1;

  // Draw distance in metres, which is how far the simulator is asked
  // to describe things.  Zero leaves it as it is; anything else sets
  // it, and the response reports what it ended up as.
  float draw_distance = 2;
}

message PresenceResponse {
  // Where the avatar is, in region coordinates, as last reported by
  // the simulator.  Precise after a teleport or a region entry, and to
  // the nearest metre while walking, which is all
  // CoarseLocationUpdate carries.
  Vector3 position = 1;

  // Where it is looking.
  Vector3 look_at = 2;

  // The camera the simulator is told about.  It follows the avatar.
  Vector3 camera = 3;

  float draw_distance = 4;
  uint64 region_handle = 5;
  string region = 6;

  // The group the avatar is acting as, which a parcel's build and
  // script rights are usually granted to rather than to individuals.
  // It arrives at login and whenever it changes, so a client that
  // attached later would never have heard it.
  string active_group = 7;

  // Every group the avatar has joined, which is what active_group can
  // be chosen from.  It travels for the same reason: the simulator
  // volunteers it shortly after the handshake and again whenever it
  // changes, so a client that attached later has no way to ask for it.
  //
  // Empty means "not told yet" as much as "belongs to none", and
  // nothing here can tell those apart.
  repeated GroupMembership groups = 8;
}

// GroupMembership is one of the avatar's groups, as
// AgentGroupDataUpdate describes it.
message GroupMembership {
  string id = 1;
  string name = 2;

  // What this membership is allowed to do, as the bitfield the
  // simulator sends.  Nothing here interprets it; it crosses so that a
  // client which wants to can.
  uint64 powers = 3;
}

// ------------------------------------------------------------- objects

message ObjectsRequest {
  string agent = 1;

  // Named, if set, returns only objects with this name.  A name is
  // only known if something has asked for it, so an object whose name
  // has never been requested does not match anything.
  string named = 2;

  // Id, if set, returns just that object.
  string id = 3;
}

message ObjectInfo {
  string id = 1;
  uint32 local = 2;

  // Parent is the local id of the root this is linked under, zero for
  // a root.
  uint32 parent = 3;

  // Pcode is 9 for a prim and 47 for an avatar.
  uint32 pcode = 4;

  Vector3 scale = 5;
  Vector3 position = 6;

  // Name is empty until something has asked for it.  Owner is filled
  // in by a compressed update as well as by asking.
  string name = 7;
  string owner = 8;

  // TextureEntry is the packed per face appearance, when one has been
  // seen.  It usually arrives only in a compressed update.
  bytes texture_entry = 9;

  // Text is the floating text above the object.
  string text = 10;

  // Where a worn object is attached, and the inventory item it was
  // worn from; both zero when it is not worn.
  //
  // The item is the only stable name a worn object has: it is rezzed
  // afresh, with a new id, every time it is put on and every time the
  // avatar logs in. A program that wants to find the same attachment
  // twice must look for the item it came from, and must ask whoever
  // was connected when it was described -- which is this server.
  uint32 attach_point = 11;
  string attach_item = 12;

  // Rotation, and the prim's form.
  //
  // Both arrive with every update and neither can be asked for
  // afterwards, so a client that wants to describe an object as it
  // stands has to be told them by whoever was listening.
  Quaternion rotation = 13;
  PrimShape shape = 14;
}

// Quaternion is a rotation, unpacked: the wire form is three floats
// with the fourth recovered by normalising, and this is after that.
message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// PrimShape is what gives a prim its form, in the protocol's own packed
// units rather than anything a person would recognise.  Unpacking them
// is sl.UnpackShape's business, and doing it here would put the same
// arithmetic in two places.
message PrimShape {
  uint32 path_curve = 1;
  uint32 profile_curve = 2;
  uint32 path_begin = 3;
  uint32 path_end = 4;
  uint32 path_scale_x = 5;
  uint32 path_scale_y = 6;
  uint32 path_shear_x = 7;
  uint32 path_shear_y = 8;
  int32 path_twist = 9;
  int32 path_twist_begin = 10;
  int32 path_radius_offset = 11;
  int32 path_taper_x = 12;
  int32 path_taper_y = 13;
  uint32 path_revolutions = 14;
  int32 path_skew = 15;
  uint32 profile_begin = 16;
  uint32 profile_end = 17;
  uint32 profile_hollow = 18;
}

message ObjectsResponse {
  repeated ObjectInfo objects = 1;

  // Known is how many objects the session has heard about in total,
  // which is what the filtered list was drawn from.
  int32 known = 2;
}

// -------------------------------------------------------------- region

message RegionRequest { string agent = 1; }

message RegionInfo {
  string id = 1;
  uint64 handle = 2;
  string name = 3;

  uint32 flags = 4;
  uint64 flags_extended = 5;

  // Access is the maturity rating; owner is the estate owner.
  uint32 access = 6;
  string owner = 7;
  bool estate_manager = 8;

  float water_height = 9;

  string product_name = 10;
  string product_sku = 11;
  string colo_name = 12;
  int32 cpu_class = 13;
  int32 cpu_ratio = 14;
  uint64 protocols = 15;

  // Known is false until the handshake has arrived.
  bool known = 16;
}

message FriendsRequest { string agent = 1; }

message Friend {
  string id = 1;

  // Online is what the last notification said.  It is false for a
  // friend nobody has said anything about, which is the same answer as
  // a friend known to be logged out -- the grid does not distinguish
  // them either.
  bool online = 2;

  // Rights are bit masks: 1 see me online, 2 see me on the map, 4 edit
  // my objects.  Given is what this avatar granted the friend, has is
  // what the friend granted back.  Both are zero for a friendship
  // formed during the session, which arrives as a notification rather
  // than in the login response.
  int32 rights_given = 3;
  int32 rights_has = 4;
}

message FriendsResponse { repeated Friend friends = 1; }

message NoteFriendRequest {
  string agent = 1;

  // Id is the new friend.  Online is what the client knows: somebody
  // whose offer was just accepted, or who just accepted ours, was
  // logged in a moment ago.
  string id = 2;
  bool online = 3;
}

message NoteFriendResponse {}

message FlushRequest { string agent = 1; }

message FlushResponse {
  // Forgotten is how many objects the cache held.
  int32 forgotten = 1;
}
