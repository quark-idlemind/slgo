syntax = "proto3";

// Package slgo.v1 is the link between a server holding grid connections
// and the clients attached to it.
//
// The division is that the server owns whatever breaks if a client
// restarts -- the circuit, its sequence numbers, retransmission,
// acknowledgements, the login and the capability URLs -- and nothing
// else.  It does not decode message bodies, hold an inventory,
// understand chat or know what a script is.  The one body it reads is a
// MoneyTransferRequest a client sends, which it checks against the
// profile's rules for paying before it goes.
//
// A grid message crosses as its number and its undecoded bytes, so the
// server relays a message type it has never heard of and a client can
// be restarted as often as you like without the grid noticing.
package slgo.v1;

option go_package = "github.com/quark-idlemind/slgo/proto/slgov1";

service Grid {
  // Login authenticates a caller, BOTH WAYS, before anything else is
  // accepted. Two calls of one message type; see LoginRequest.
  //
  // slgod holds a live Second Life session, so an unauthenticated one
  // reachable off this machine is an open invitation to drive somebody
  // else's avatar. The exchange is the same one slrund uses, from the
  // same package.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Stream is the packet channel.  The client sends messages to put on
  // the circuit and receives the ones it has subscribed to.  Nothing
  // that is not a grid packet belongs here.
  //
  // A stream outlives a session that drops and is re-established under
  // it; the AgentEvents on it say what happened.  It ends, with
  // FAILED_PRECONDITION and a message saying why, when the session is
  // finished with for good: logged out, ended by the grid, no longer
  // hosted, or logged out by the server shutting down.  Whatever was
  // queued for the client before that goes out first, the notice saying
  // why among it.  A client that lets the answers to its own requests
  // pile up unread has its stream ended with RESOURCE_EXHAUSTED rather
  // than lose one.
  rpc Stream(stream ClientPacket) returns (stream ServerPacket);

  // Everything below is the server answering for itself rather than
  // relaying the grid.

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);

  // Host brings a session up that is not running, and Logout puts one
  // down and keeps it down.
  //
  // Both are deliberate acts by a person, which is why they are their
  // own methods rather than something that happens as a side effect of
  // attaching.  Logging an avatar in is visible on the grid -- an
  // arrival, a presence, a notice to whoever is watching -- and should
  // not follow from a typo in a stale config file.
  //
  // Logout is remembered.  A session that was told to stop stays
  // stopped, so that somebody using that avatar in a viewer is not
  // fighting the daemon for it, and comes back only when asked for by
  // name.
  rpc Host(HostRequest) returns (HostResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Presence reads where the avatar is and what it can see, and can
  // change the draw distance.
  //
  // Both belong to the server.  AgentUpdate is what puts a session in
  // the simulator's interest list, it has to keep being sent, and the
  // interest list is worked out from the camera rather than from where
  // the avatar is -- so a client that owned this would empty the
  // interest list for every other client by exiting.  A client can ask
  // what it is and ask for it to be changed; it cannot hold it.
  rpc Presence(PresenceRequest) returns (PresenceResponse);

  // Objects is what the region has told the session about itself.
  //
  // The server holds this for the same reason it holds the camera: a
  // region describes itself once, when the avatar arrives, and a
  // client that attaches a minute later is never told any of it.  The
  // server was there to hear it, so the server remembers.  It still
  // has no idea what any of the objects are for.
  rpc Objects(ObjectsRequest) returns (ObjectsResponse);

  // Attachments is what the simulator last said an avatar is wearing:
  // the attachment list at the end of AvatarAppearance.
  //
  // Held by the server for the reason Objects is.  The simulator sends
  // it unasked -- about other avatars when they arrive, about this one
  // when it is baked -- so a client that attached afterwards has no
  // other way to hear it.
  //
  // It is the simulator's own account, which the region's object
  // descriptions are not: a viewer keeps an avatar a cloud until what
  // it has been shown matches this list, and a client can tell "on,
  // and not described yet" from "not on" the same way.
  rpc Attachments(AttachmentsRequest) returns (AttachmentsResponse);

  // Region is what the simulator said about itself in the handshake,
  // which happens once, before any client is listening.
  rpc Region(RegionRequest) returns (RegionInfo);

  // SimStats is what the simulator has said about how it is doing --
  // time dilation, frame rate, script time, agents and objects -- over
  // the last minute.  It says it every two seconds to whoever is there,
  // and a client that was not listening can be told it only from here.
  rpc SimStats(SimStatsRequest) returns (SimStatsResponse);

  // Land is what the session was told about the ground it is on: the
  // parcel it was pushed on arrival, and the region's parcel overlay.
  //
  // Both arrive unasked, once, before any client is listening, and the
  // overlay is the half that cannot be asked for again -- four packets
  // on arrival and none afterwards, however politely a client asks.
  // The parcel can be asked for, in a tenth of a second, so only its
  // name and local id come back here: enough to say what the session
  // believes it is standing on when the asking fails or is not worth
  // the wait.
  rpc Land(LandRequest) returns (LandInfo);

  // Ground is the height of the land: at a point, or the highest it
  // comes anywhere in a rectangle.
  //
  // Held by the server for the reason Land is.  The heightmap arrives
  // once, in the first seconds after the avatar does, and a region sends
  // it again to nobody who asks; the server decodes it as it comes, as a
  // viewer does, and answers from that.
  rpc Ground(GroundRequest) returns (GroundResponse);

  // Neighbours reads the circuits held to the regions AROUND that one,
  // and can turn them on and off.
  //
  // The same division as Presence, for the same reason.  A simulator
  // will not hand an avatar over a border to a client that holds no
  // circuit to the region on the other side, and holding one costs a
  // socket and a share of the traffic for as long as it is held -- so
  // it belongs to the server, which owns the circuits and pays for
  // them, and a client asks what it is and asks for it to be changed.
  //
  // Worth changing while a session is up, which is why this is not a
  // daemon-wide switch: one avatar is being driven by a person who
  // wants to walk out of the region, and the next is running a
  // benchmark that wants nothing but the region it is in.
  rpc Neighbours(NeighboursRequest) returns (NeighboursResponse);

  // Flush empties the object cache.
  //
  // It is done automatically when the region changes, since everything
  // cached then describes somewhere else.  This is for a client that
  // knows the cache is wrong for a reason the server cannot see.
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Cap makes an HTTP request against one of the agent's
  // capabilities.  The server holds the URLs and does the request; it
  // has no idea what any of them mean.  This is what keeps inventory,
  // asset upload and script compilation out of the server.
  rpc Cap(CapRequest) returns (CapResponse);

  // Send puts one message on the circuit without opening a stream, for
  // a client that only wants to say one thing.  A payment the profile's
  // rules refuse is not sent, and is answered PERMISSION_DENIED with the
  // reason.
  rpc Send(SendRequest) returns (SendResponse);

  // Control sends one AgentUpdate carrying control flags, and forgets
  // them.  Sitting on the ground and standing up are nothing but this.
  //
  // It belongs to the server for the reason Presence does, and more
  // sharply.  An AgentUpdate is not just its flags: it carries the
  // camera, its three axes and the draw distance, and the simulator
  // scopes its interest list by them.  A client has none of that -- it
  // knows a position from Presence and no axes at all -- so a client
  // that built one would be guessing at the camera and inventing a draw
  // distance, and the simulator would believe it until the server's own
  // update a second later put it back.  The server owns the camera, so
  // the server is the only thing that can send an update that is right
  // about everything except the one bit being asked for.
  //
  // A primitive rather than a sit call and a stand call, because it is
  // the same shape as everything else that moves an avatar: fly, stop,
  // jump, and the nudges a walk is made of.
  rpc Control(ControlRequest) returns (ControlResponse);

  // Move walks the avatar to a place in its region, and streams how it
  // is going until it is over.
  //
  // It belongs to the server for Control's reason and one more.  A walk
  // is a control flag held down on AgentUpdate, ten times a second,
  // with the body turned toward the target from where the avatar
  // actually is -- and the one that holds a flag down has to be the one
  // certain to let go of it.  A client that crashed mid-walk would leave
  // the last update it caused saying "forward", and the avatar would
  // walk until it met something.  The server steers, and a client that
  // goes away -- this stream ending, for any reason -- stops the avatar.
  //
  // The stream is a MoveEvent about every quarter of a second while the
  // avatar moves, and one final event, whose state is anything but
  // MOVING, after which it ends.  A walk that cannot start -- a target
  // outside the region, an avatar that is sitting, a viewer driving it
  // -- is that final event and nothing else, before anything is sent.
  //
  // One walk per avatar.  A second Move takes the first over without
  // stopping in between, and the first stream ends CANCELLED with the
  // reason "superseded"; Halt ends it with "halted" and stops the
  // avatar.
  //
  // It walks a straight line and avoids nothing.  What is in the way is
  // the client's to steer round, by asking again with a different
  // target; the server notices only that the avatar has stopped getting
  // closer, which is BLOCKED.
  rpc Move(MoveRequest) returns (stream MoveEvent);

  // Face turns the avatar toward a place, or to a heading, without
  // moving it.  Every update after it keeps the facing, the server's
  // own once-a-second ones included.  A walk under way is ended by it,
  // as a superseded one.
  rpc Face(FaceRequest) returns (FaceResponse);

  // Halt ends any walk and stops the avatar.
  rpc Halt(HaltRequest) returns (HaltResponse);

  // Posture is whether the avatar is standing, sitting on the ground or
  // sitting on something, as the daemon's own agent knows it.  A client
  // that attached after the sit has not seen the animation that is the
  // only evidence of a ground sit, nor necessarily the reparenting, and
  // would otherwise guess; the agent has watched every one since login,
  // and it is what a walk is refused on.
  rpc Posture(PostureRequest) returns (PostureResponse);

  // Friends is who this avatar's friends are and which of them are
  // logged in.
  //
  // The server holds this for the same reason it holds the region's
  // objects: the grid says it once, to whoever was there. The list
  // itself arrives only in the login response -- it is on no message
  // the simulator ever sends -- and online status arrives as a burst
  // of OnlineNotification seconds after the handshake, long before a
  // client can attach. Neither can be asked for again.
  rpc Friends(FriendsRequest) returns (FriendsResponse);

  // NoteFriend records a friendship the client watched being formed.
  //
  // Accepting an offer is the one case the grid never reports. The
  // side that offers is told twice -- an instant message saying so
  // and an OnlineNotification -- and the side that accepts is told
  // nothing whatsoever, because it was the one that did it. A viewer
  // has the same hole and fills it the same way, by adding the friend
  // to its own list (LLAvatarTracker::formFriendship).
  //
  // So the client, which understands what it just sent, tells the
  // server, which holds what a client restart would lose. The server
  // still decodes nothing.
  rpc NoteFriend(NoteFriendRequest) returns (NoteFriendResponse);

  // Handled tells the server an offer it is keeping has been dealt
  // with -- accepted, declined, or put aside for good -- so that it
  // drops out of the record and out of every other client's list.
  //
  // The server keeps the offers that arrive for an avatar whether or
  // not anybody is attached: a teleport offered, a request to be
  // offered one, an item handed over, an offer of friendship, an
  // invitation into a group.  Each is answered by quoting an id that
  // arrives once and cannot be asked for again, and the daemon is the
  // one thing that is always there to hear it; a client that attaches
  // later is handed what is still waiting in Attached.offers.  That
  // makes this the second place the server reads a message body, after
  // the teleport and seat answers it reads for itself, and for the same
  // reason: it is the session's business whether or not anybody is
  // listening.
  //
  // A client calls it BEFORE sending its answer, and the answer says
  // whether to go on.  Two clients attached to one avatar see the same
  // offers, and the first to say it is dealing with one is the one
  // that does; the second is told who got there first and how, and
  // sends nothing.  A client whose answer then fails to go out calls
  // again with undo, and the offer is put back for everybody.
  rpc Handled(HandledRequest) returns (HandledResponse);

  // ViewerCredential mints a password a real viewer may log in with
  // ONCE, so that a session can be handed to a person without any
  // password being typed or stored anywhere.
  //
  // A call of its own rather than a field of StatusResponse because
  // asking is not free: every call makes a fresh secret and drops the
  // one before it, which is not something a client watching the
  // counters should do by accident.  Where the endpoint is and whether
  // a viewer is on it are facts and cost nothing to read, so they
  // travel in StatusResponse.viewer instead.
  rpc ViewerCredential(ViewerCredentialRequest) returns (ViewerCredentialResponse);
}

// ------------------------------------------------------------ packets

// ClientPacket is a message the client wants put on the circuit, or the
// opening frame naming the agent to attach to.
// Login is one message type used twice.
//
//   client -> server   (empty)
//   server -> client   SCHAL, 16 random bytes
//   client -> server   CCHAL, HMAC(secret, SCHAL || "CLIENT" || binding)
//   server -> client   HMAC(secret, CCHAL || "SERVER" || binding)
//
// Mutual, so neither side proceeds until the other has shown it knows
// the shared secret, and bound to the TLS session so that the whole
// exchange cannot simply be relayed by something in the middle.
//
// Success authenticates the CONNECTION. There is no token: TLS already
// made a session and this proved who is on the far end of it.
message LoginRequest {
  // The client's name was a string here, field 1, and is not any more;
  // see client_0.  Reserved rather than reused, so that a client built
  // before the change is still recognisable when it sends one: the
  // server finds field 1 among the fields it does not know, and tells
  // it it is too old rather than merely refusing it.
  reserved 1;
  reserved "client";

  // Challenge is the client's own challenge, 16 bytes, and proof its
  // answer to the server's, one HMAC-SHA256 of 32.  Each has exactly
  // one right length, and the server refuses any other before doing any
  // work with it.
  bytes challenge = 2;
  bytes proof = 3;

  // Pid is the client's process id.
  //
  // So that a message about what is holding a session can name which
  // COPY of a program it is -- "slsh[1234]" rather than "slsh" -- when
  // somebody has three shells open and only one of them is in the way.
  //
  // The address is deliberately NOT here.  The server takes that from
  // the connection it is being spoken to on, because a client could
  // say anything and the whole value of the line is that it tells you
  // where to go and look.
  int32 pid = 4;

  // Client_0 to client_3 are the client's name -- the program's, "slsh"
  // or "slbotd" -- as up to 32 bytes of UTF-8 packed eight to a field,
  // first byte most significant, and padded with zero bytes.
  //
  // Ugly, but proto has no formal way of limiting the length of a
  // field.  A string is whatever length the sender says, up to the
  // whole 4 MB message, and this one arrives before the caller has
  // proved anything and is kept, in every pending challenge, until it
  // answers.  So the name is carried in fields that cannot be
  // longer: fixed64 rather than uint64 because a varint is itself of
  // variable length, where a fixed64 is eight bytes on the wire, always.
  // A repeated field would not do either, since it repeats as often as
  // the sender likes.  (A sender can repeat any field on the wire, but
  // for one that is not repeated only the last is kept.)
  //
  // A longer name is cut short by the client, at a character boundary.
  // It is a label for a person reading a sentence, not an identifier,
  // and a program's name never needs more.  See auth.PackName.
  fixed64 client_0 = 5;
  fixed64 client_1 = 6;
  fixed64 client_2 = 7;
  fixed64 client_3 = 8;
}

message LoginResponse {
  bytes challenge = 1;
  bytes proof = 2;
}

message ClientPacket {
  oneof body {
    Attach attach = 1;
    OutboundMessage message = 2;

    // Which messages to relay is state of this stream, so it is
    // adjusted on the stream rather than by an RPC that would have no
    // way to say which stream it meant.
    Subscribe subscribe = 3;

    // Asking for and giving up a lock.  On the stream for the same
    // reason: a lock belongs to the client holding it, and the stream
    // is what says which client that is -- and, more to the point,
    // when it has gone away.  A lease held by a stream is released
    // when the stream ends, whether the client exited, crashed or was
    // unplugged, and that needs no heartbeat of its own.
    Lock lock = 4;
    Unlock unlock = 5;

    // Asking for a number of the shared objects at once, and giving
    // them back.  On the stream for the same reason a lock is, and
    // more so: what a client holds has to be given back when it goes
    // away, however it went.
    Slots slots = 6;
    RenewSlots renew_slots = 7;
    ReleaseSlots release_slots = 8;
  }
}

// Slots asks for a number of the shared objects at once.
//
// It is answered all of them or none.  A caller given four of the eight
// it asked for could only hold them while waiting for the rest, which is
// how two callers deadlock against each other, or give them back -- so
// the daemon gives them back for it and answers with nothing.
//
// They need not all belong to one avatar.  A request is for a COUNT, and
// a daemon holding three avatars answers it out of whichever have places
// free; the answer says which avatar each came from.
message Slots {
  // Want is how many.  More than the daemon has anywhere is refused
  // rather than waited for.
  uint32 want = 1;

  // Seconds is how long they are wanted for.  Zero takes the daemon's
  // own default.  A grant that runs out is taken back, so work that
  // cannot say in advance how long it will take renews instead of
  // guessing high.
  uint32 seconds = 2;

  // Try asks for an answer now rather than a turn.  Waiting is the
  // default, for the reason Lock gives.
  bool try = 3;

  // Agent asks for places on one avatar rather than from wherever they
  // are free: for a caller that named an avatar and meant it, or work
  // that needs its objects in one region, since two avatars may be in
  // two.  Empty is anywhere.  A name the daemon does not host, or an avatar that is
  // logged out, is refused at once; one it is still logging in is waited
  // for.
  string agent = 4;

  // Request is the client's own number for this ask, which the answer
  // carries back in SlotsGranted.request.  Answers do not come back in
  // the order they were asked for -- a wait ends when places come free
  // -- so a client with more than one ask out matches them by this.
  // Zero is a client older than the field.
  uint64 request = 5;

  // WaitSeconds bounds the wait.  Zero waits as long as it takes; any
  // other number gives up after that many seconds with an answer saying
  // so, why set and nothing granted.  A try is answered at once
  // whatever this says.
  uint32 wait_seconds = 6;
}

// RenewSlots puts a grant's clock back, for work that cannot say in
// advance how long it will take.
message RenewSlots {
  string grant = 1;
  uint32 seconds = 2;

  // Request is as in Slots.
  uint64 request = 3;
}

// ReleaseSlots gives a grant back.  Ending the stream does the same
// thing.
message ReleaseSlots {
  string grant = 1;

  // Clean says the objects were left fit for the next caller: nothing
  // of this caller's is still running in them.  Without it the next
  // caller is told they need clearing before it uses them, because a
  // script left running is a line that caller would read as its own.
  bool clean = 2;
}

// Lock asks for exclusive use of something named.
//
// The name is whatever the clients agree it is; slgod attaches no
// meaning to it and only ever compares it. "auto" is the object
// slrun and slbench run their scripts in, which one client must
// have to itself: a benchmark carries its base reading in that object's
// linkset data, which belongs to the object and not to the script, so
// two runs at once would divide by each other's numbers.
message Lock {
  string name = 1;

  // Try asks for an answer now rather than a turn: held comes back
  // false if somebody else has it. Waiting is the default, because a
  // program that wants the lock almost always wants to get on with the
  // work once it has it, and the alternative it would otherwise write
  // for itself is a sleep and another ask.
  bool try = 2;

  // Request is the client's own number for this ask, which the answer
  // carries back in Locked.request.  Answers do not come back in the
  // order they were asked for -- a try is answered at once, a wait when
  // the lock is given -- so a client with more than one ask out for a
  // name matches them by this.  Zero is a client older than the field.
  uint64 request = 3;
}

// Unlock gives one back.  Ending the stream does the same thing.
message Unlock {
  string name = 1;
}

// Locked answers a Lock: held says whether it is now this client's.
// For a waiting Lock it does not arrive until the lock is this
// client's, so held is true; for a trying one it comes straight back
// either way.
message Locked {
  string name = 1;
  bool held = 2;

  // Who has it, when held is false and somebody else does. It is for a
  // person to read, not to act on.
  string holder = 3;

  // Request is the number of the Lock this answers.  Zero is a daemon
  // older than the field, whose answers a client can only match to its
  // asks by name, in the order they were made.
  uint64 request = 4;
}

// Subscribe adjusts what this stream relays.  Exactly one field is
// used: set replaces the subscription, add and remove adjust it.
message Subscribe {
  repeated string set = 1;
  repeated string add = 2;
  repeated string remove = 3;

  // Replace says set is meant, even when it is empty.
  //
  // It exists because proto3 writes an empty repeated field as no
  // field at all, so "subscribe to nothing" and "leave the
  // subscription alone" arrive identically -- which made clearing a
  // subscription a silent no-op, on exactly the connection that most
  // needs it.  A server still honours a set that has names in it
  // without this, so a client older than the field works as it always
  // did.
  bool replace = 4;
}

// Attach must be the first frame on a stream.
message Attach {
  string agent = 1;

  // Messages to relay, by template name.  "*" means everything.  Empty
  // means nothing until Subscribe says otherwise, which is the default
  // because a busy region will otherwise flood the link.
  repeated string subscribe = 2;

  // Weak says this client is attached but is not USING the avatar in
  // the sense that should stop anybody else managing it.
  //
  // Logout refuses a session somebody is using, so that a benchmark
  // mid-run is not thrown away by a stray command.  A daemon that sits
  // attached to every avatar all day defeats that: it is always in the
  // way, and "logout" comes to mean "logout --force", which is a flag
  // people then type without reading.
  //
  // So a client that attends rather than uses says so, and is not
  // counted when the question is whether anybody would mind.  It is
  // still relayed to, still counted in the client total, and still
  // told what happened -- this changes who is CONSULTED, nothing else.
  //
  // It is the client's own word about itself, which is right: only it
  // knows whether losing the session would spoil something.
  bool weak = 3;
}

message OutboundMessage {
  // The message number, as slgo's msg.ID.  Name may be given instead
  // and is looked up in the template.
  uint32 id = 1;
  string name = 2;

  // The encoded message body, without the packet header or the message
  // number.  The server frames it: sequence numbers and reliability
  // are circuit state and are not the client's to choose.
  bytes body = 3;
  bool reliable = 4;
}

// ServerPacket is a message that arrived from the simulator, or a note
// about the connection.
message ServerPacket {
  oneof body {
    InboundMessage message = 1;
    Attached attached = 2;

    // A note about the grid connection itself: it went away, it came
    // back.  Not grid traffic.
    AgentEvent notice = 3;

    // Something that arrived on the event queue rather than the UDP
    // circuit.  Its body is LLSD, not the binary message encoding, so
    // it cannot share InboundMessage.
    InboundEvent event = 4;

    // The answer to a Lock.
    Locked locked = 5;

    // The answer to Slots or RenewSlots.
    SlotsGranted granted = 6;

    // An offer the server was keeping has been dealt with, by this
    // client or another, and is no longer waiting.  Sent to every
    // client that subscribed to ImprovedInstantMessage, which is what
    // every offer arrives in.  See Handled.
    OfferHandled handled = 7;
  }
}

// OfferHandled says one offer is no longer waiting, and why.
message OfferHandled {
  // Offer is the server's name for it, as InboundMessage.offer gave it.
  string offer = 1;

  // How is what was done, in words for a person: "accepted",
  // "declined", "refused".  The client that dealt with it chose them.
  string how = 2;

  // By is the client that dealt with it, as it named itself when it
  // connected.  Empty means the server saw the answer go out without
  // being told first -- a client too old to call Handled, or a viewer
  // -- and cannot say which program sent it.
  string by = 3;

  // At is when, in microseconds since the epoch.
  int64 at = 4;
}

// OfferRecord is the offers the server is keeping for an avatar, as they
// stood when a client attached.
message OfferRecord {
  // Messages are the offers, each as the ImprovedInstantMessage it
  // arrived in, oldest first, with offer and recorded set and
  // received_at saying when it arrived.  A client reads them exactly as
  // it reads the ones relayed live, so that nothing about what an offer
  // is has to be understood on this side of the link.
  repeated InboundMessage messages = 1;

  // Since is when the server began keeping them for this avatar, in
  // microseconds since the epoch.  An offer made before then -- while
  // the daemon was down, or before it logged this avatar in -- is not
  // in the record and cannot be.
  int64 since = 2;

  // Evicted is how many unanswered offers have been dropped to make
  // room, oldest first, and limit is how many are kept.  An empty
  // record with evicted above zero is not the same answer as an empty
  // one with evicted at zero.
  uint32 evicted = 3;
  uint32 limit = 4;
}

message HandledRequest {
  string agent = 1;

  // Offer is the server's name for it, from InboundMessage.offer.
  string offer = 2;

  // How is what the client is doing about it, for other clients to
  // read in OfferHandled.  Empty is taken as "dealt with".
  string how = 3;

  // Undo puts back an offer this client said it was handling and then
  // could not: its answer never went out.  The offer is relayed again,
  // marked recorded, to every client that subscribed to it.
  bool undo = 4;
}

message HandledResponse {
  // Claimed says this call is the one that took the offer out of the
  // record.  A client goes on and sends its answer when it is true, and
  // when it is false with no earlier -- the server was not keeping that
  // offer, or no longer remembers it, which says nothing either way.
  bool claimed = 1;

  // Earlier is who dealt with it before this call did.  A client that
  // gets one back sends nothing: the offer has been answered already.
  OfferHandled earlier = 2;

  // Restored says an undo found the offer and put it back.
  bool restored = 3;
}

// SlotsGranted answers Slots and RenewSlots.
message SlotsGranted {
  // Grant names what was given and is what RenewSlots and ReleaseSlots
  // take.  Empty when nothing was given.
  string grant = 1;

  // Held is where to run, one entry per object.
  repeated SlotHeld held = 2;

  // Expires is when the grant runs out, in seconds since the epoch.
  // The holder should renew before then; a write after it may be
  // refused, because by then the objects may be somebody else's.
  int64 expires = 3;

  // Why nothing was given, when nothing was.  For a person to read.
  string why = 4;

  // Request is the number of the Slots or RenewSlots this answers.
  // Zero is a daemon older than the field, whose answers a client can
  // only match to its asks in the order they were made.
  uint64 request = 5;
}

// SlotHeld is one place to run.
message SlotHeld {
  // Agent is which avatar's object this is.  One grant may name more
  // than one, so a client works out which session to run in from here.
  string agent = 1;

  // Slot is which of that avatar's places, counted from zero.  It is
  // the number, not the object: the object is rezzed afresh with a new
  // id every time it is worn, and finding it is the client's business.
  uint32 slot = 2;

  // Dirty says the last holder did not say it left this fit to use, so
  // whatever it was running may still be running.  Clear it before
  // listening to it.
  bool dirty = 3;
}

// InboundEvent is one entry from EventQueueGet.
//
// The queue carries what UDP no longer does: ParcelProperties,
// TeleportFinish, EstablishAgentCommunication and the rest.  A poll
// must be kept running continuously and its sequence acknowledged, so
// it belongs on the server for the same reason the circuit does -- a
// client restart would lose the sequence and drop events.
message InboundEvent {
  // The event name, as the queue gives it.  Some match a template
  // message and some have no UDP equivalent at all.
  string message = 1;

  // The event body, LLSD encoded.  The server does not look inside.
  bytes body = 2;

  int64 received_at = 3;
}

message Attached {
  AgentInfo agent = 1;

  // Offers is what is still waiting for an answer, including whatever
  // arrived while no client was attached.  Carried here rather than
  // asked for, because only the attach itself can promise that nothing
  // falls between the record and the live relay: an offer is either in
  // this or relayed after it, and a client reading the record with a
  // separate call could miss one arriving in between.
  //
  // Present only when the attach subscribed to ImprovedInstantMessage,
  // and absent from a server too old to keep a record -- which a client
  // should say, since without one it knows only what it saw arrive.
  OfferRecord offers = 2;
}

message InboundMessage {
  uint32 id = 1;

  // The template's name for the message, empty when the number is not
  // in this server's template.  The body is relayed either way.
  string name = 2;

  bytes body = 3;
  uint32 sequence = 4;
  uint32 flags = 5;

  // Microseconds since the epoch, when the datagram was read.
  int64 received_at = 6;

  // FromClient names the client that SENT this message, when it did not
  // come from the grid at all.
  //
  // The grid does not echo what an avatar says.  A viewer shows your own
  // remarks because it composed them; two clients on one session
  // therefore each see everything the grid sent and nothing the other
  // said, so a person watching through slsh while a daemon answers for
  // the same avatar sees half a conversation -- the half they did not
  // write.  That was the fault this fixes.
  //
  // So a message a client puts on the circuit is relayed to the OTHER
  // clients of that session, to whichever of them subscribed to its
  // number, with this field naming who sent it.  Empty means the grid,
  // which is every message that existed before this field did.
  //
  // The server still decodes nothing.  It relays the bytes it was
  // handed, to the same subscriptions, with one more string attached;
  // which messages are worth echoing is decided by what clients ask for
  // and not by anything here knowing what an instant message is.
  //
  // "slgod" is the server itself, on a MoneyBalanceReply it made up to
  // refuse a payment the client sent: success false, the transaction as
  // it was asked for, and the reason as its description.  It goes to
  // that client alone, whatever it subscribed to.
  string from_client = 7;

  // Offer is the server's name for an offer it is keeping, when this
  // message is one; empty for everything else.  A client quotes it to
  // Handled.  It is opaque: a client that wants to know what the offer
  // is reads the message.
  string offer = 8;

  // Recorded says this did not just arrive.  It is out of the server's
  // record -- handed over at attach, or put back by an undo -- and a
  // client should keep it as waiting without announcing it as news.
  bool recorded = 9;
}

// AgentEvent is something that happened to the grid connection itself.
message AgentEvent {
  enum Kind {
    UNKNOWN = 0;
    REGION_CHANGED = 1;
    DISCONNECTED = 2;
    KICKED = 3;
  }
  Kind kind = 1;
  string detail = 2;

  // Where the avatar is now, for REGION_CHANGED: the name the new
  // region gave in its handshake and the handle it answers to.
  //
  // They travel with the notice so that a client can drop what it holds
  // without a round trip.  A region change is the news that local ids,
  // the object cache and everything keyed on either belong to somewhere
  // the avatar has left, and a client that had to ask where it is
  // before believing that would be acting on the old region for as long
  // as the question took.
  //
  // Both may be empty on a notice from a server that does not fill them
  // in, which says nothing about whether the region changed: the kind
  // is what says that.
  string region = 3;
  uint64 region_handle = 4;

  // Why the avatar moved, for REGION_CHANGED: the TeleportFlags of the
  // TeleportStart that began the teleport, or zero when the region
  // changed some other way (a border crossed, a session made again) or
  // no TeleportStart came in the minute before.  The bits are the
  // viewer's TELEPORT_FLAGS_*.  A server that does not fill it in sends
  // zero, which says nothing about why.
  uint32 teleport_flags = 5;
}

// ------------------------------------------------------------ control

message AgentInfo {
  string name = 1; // the profile name the server hosts it under
  string agent_id = 2;
  string session_id = 3;
  string avatar_name = 4;
  string region = 5;
  string channel_version = 6;
  string inventory_root = 7;
  repeated string caps = 8;
  bool connected = 9;

  // State is what can be done with this agent, which is not the same
  // question as whether a circuit is up.
  //
  // The distinctions earn their keep by being different actions: a
  // CONFIGURED agent can be started, a STOPPED one deliberately should
  // not be started unless asked for by name, and a FAILED one will
  // waste a login attempt if asked too soon.  Without them, "I have
  // never heard of qi" and "qi is deliberately down" look identical,
  // and the second is not an error at all.
  enum State {
    UNKNOWN = 0;
    HOSTED = 1;      // logged in and serving
    CONNECTING = 2;  // a login is in flight
    CONFIGURED = 3;  // a profile exists; nothing has asked for it
    STOPPED = 4;     // deliberately down; do not start unasked
    FAILED = 5;      // tried and could not; see detail
  }
  State state = 10;

  // Detail says why, for the states where why is the useful part:
  // the grid's own words for a kick, or the login server's for a
  // refusal.  Meant for a person.
  string detail = 11;
}

message HostRequest {
  // Agent names the profile to bring up.  It must be named: this is
  // the one call where "whichever" cannot mean anything.
  string agent = 1;

  // Force starts one that was deliberately stopped.  Without it a
  // STOPPED agent is left alone, since something stopped it on
  // purpose -- most likely a person now using that avatar elsewhere.
  bool force = 2;
}

message HostResponse {
  AgentInfo agent = 1;

  // Already is true when it was up before the call, which makes Host
  // safe to repeat.
  bool already = 2;
}

message LogoutRequest {
  string agent = 1;

  // Force logs out even with clients attached.  Without it, a session
  // somebody is using is left alone and their names come back in the
  // error: a benchmark mid-run has a script installed and a reading
  // half-taken, and losing it should be somebody's decision.
  bool force = 2;
}

message LogoutResponse {
  // Clients is who was attached when this was refused, empty when it
  // was not refused.
  repeated string clients = 1;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message StatusRequest {
  string agent = 1;
}

message StatusResponse {
  AgentInfo agent = 1;

  uint64 packets_in = 2;
  uint64 packets_out = 3;
  uint64 bytes_in = 4;
  uint64 bytes_out = 5;
  uint64 resent = 6;
  uint64 abandoned = 7;
  uint64 duplicates = 8;
  uint64 undecodable = 9;
  uint64 unknown_messages = 10;
  int32 clients = 11;

  // Messages nobody has registered for, by template name.  This is how
  // a protocol change announces itself.
  map<string, uint64> unhandled = 12;

  // Viewer is where a real viewer would log in to take this session
  // over.  It rides with the counters because it is the same kind of
  // thing: state the daemon holds, about one agent, that a client
  // cannot work out for itself.
  ViewerEndpoint viewer = 13;

  // How many ObjectUpdate placement blobs have arrived, by width in
  // bytes.  The width says which form a blob is in: the daemon reads
  // 60, 124 and 32, and 76, 140 and 48 for an avatar, and counts every
  // width it is sent, the ones it does not read as well.  It is here to
  // show which forms the simulator really sends.
  map<uint32, uint64> placement_widths = 14;

  // How many packets decoded only by reading past their end: a
  // zerocoded message whose last fields were read as zeros, which the
  // simulator's zero coder is known to cause, or whose Variable field
  // said it was longer than the packet and was cut at its end, which
  // is not known to happen.  Undecodable, above, counts the packets
  // that did not decode at all.
  uint64 padded = 15;
}

// ViewerEndpoint is slgod's own login server, and whether a viewer has
// come in on it.
//
// slgod can serve an XMLRPC login endpoint that hands a running session
// to a real viewer, and the address it serves on has until now appeared
// only in the daemon's log.  A person attached with a shell could not
// ask, which meant the feature was reachable only by whoever started
// the daemon and still had the terminal.
message ViewerEndpoint {
  // LoginUri is what to add to a viewer's grid list, ready to paste.
  //
  // Empty means this daemon was started WITHOUT -viewer and serves no
  // viewer logins at all -- the ordinary case, since the flag is not
  // the default.  That is a state worth naming rather than a blank
  // field: the answer to "where do I point a viewer" is then "nowhere
  // yet, restart slgod with -viewer ADDR", which a client can only say
  // if it can tell the two apart.
  string login_uri = 1;

  // Attached is whether a viewer has finished the handshake on this
  // agent's circuit.
  //
  // The daemon's own answer, and one-sided: a viewer that logs out, as
  // quitting one does, is no longer counted, but one that goes without
  // logging out -- a crash, a lost connection -- sends nothing to say so,
  // and this stays true until the next one appears.  It is therefore "a
  // viewer has taken this session" rather than "a viewer is at the
  // keyboard".
  bool attached = 2;
}

message ViewerCredentialRequest {
  string agent = 1;
}

// ViewerCredentialResponse is everything a viewer needs to log in as
// this agent, and nothing that outlives the attempt.
message ViewerCredentialResponse {
  // LoginUri is the endpoint the password is good for.  It travels
  // with the password so the two cannot be paired up wrongly by a
  // client that read the address at some other moment.
  string login_uri = 1;

  // First and Last are the avatar's name, which is what a viewer's
  // login box wants -- the profile name slgod files it under means
  // nothing to a viewer.
  string first = 2;
  string last = 3;

  // Password is plaintext, good for ONE login and for a minute or so.
  //
  // It is generated by the daemon and never stored: what the daemon
  // keeps is its digest, which is discarded the moment a login matches
  // it.  A profile stores viewer_password as a "$1$" md5 digest, so
  // nothing outside slgod can produce a password a viewer could hash
  // into a match -- minting one here is what replaces asking a person
  // for a secret they have no way of knowing.
  //
  // Whoever receives this hands it to a viewer, which means it reaches
  // a command line.  Single use and a short life are what make that
  // acceptable; see the caller.
  string password = 4;

  // ExpirySeconds is how long the password is good for, so a client
  // can say so rather than guessing.
  int32 expiry_seconds = 5;
}

message CapRequest {
  string agent = 1;
  string cap = 2;    // capability name, e.g. "InventoryAPIv3"
  string method = 3; // default GET
  string path = 4;   // appended to the capability URL
  bytes body = 5;
  string content_type = 6;

  // An absolute URL to use instead of a named capability.
  //
  // Asset upload needs this: the first step posts to a capability and
  // the simulator answers with a one-shot uploader URL to post the
  // bytes to.  Without it a client would have to reach the simulator
  // itself, which is exactly the coupling the server exists to avoid.
  //
  // Only URLs the simulator has handed us are accepted, so this cannot
  // be used to make the server fetch something arbitrary.
  string url = 7;
}

message CapResponse {
  int32 status = 1;
  bytes body = 2;
}

message SendRequest {
  string agent = 1;
  OutboundMessage message = 2;
}

message SendResponse {}

message ControlRequest {
  string agent = 1;

  // Flags are the AGENT_CONTROL bits to set on one update, as the
  // viewer's indra_constants.h numbers them: 0x00010000 stands the
  // avatar up, 0x00020000 sits it on the ground.
  //
  // They are edge triggered, measured on Agni, so this is a request and
  // not a state: the update after it carries none of them and undoes
  // nothing.  Nothing here interprets the bits.
  uint32 flags = 2;
}

message ControlResponse {}

// ------------------------------------------------------------ walking

message MoveRequest {
  string agent = 1;

  // Target is where to walk to, in the region's own metres.  Only x and
  // y are walked to: the ground decides the height.  A target outside
  // the region -- 0 to 256 on each side, which is every region on
  // Second Life's own grid -- is refused as OUT_OF_REGION before
  // anything moves; a walk never crosses a border.
  Vector3 target = 2;

  // Within is how close is close enough, flat, in metres.  Anything
  // under half a metre, zero included, is half a metre.
  float within = 3;

  // Run runs rather than walks, which is SetAlwaysRun for the length of
  // the walk and not a control flag.
  bool run = 4;

  // Timeout ends the walk CANCELLED, reason "timeout", if it has not
  // arrived by then.  Zero is no limit.
  uint32 timeout_ms = 5;

  // What BLOCKED means: less than stall_distance metres closer to the
  // target over stall_ms.  Zero is the default for each, 0.3 metres
  // and 2000 milliseconds.
  float stall_distance = 6;
  uint32 stall_ms = 7;
}

// MoveEvent is how a walk is going, or how it ended.
message MoveEvent {
  enum State {
    // MOVING is every event but the last.
    MOVING = 0;
    // ARRIVED is within the distance asked for.
    ARRIVED = 1;
    // BLOCKED is a walk that stopped getting closer.
    BLOCKED = 2;
    // CANCELLED is a walk ended by something else, which reason names:
    // "superseded", "halted", "client gone", "timeout", "left the
    // region", "seated", "a viewer took over", "session ended", or
    // "overshot" for a walk that stopped outside within three times.
    CANCELLED = 3;
    // OUT_OF_REGION is a target not in the region; nothing moved.
    OUT_OF_REGION = 4;
    // REFUSED is a walk that could not start -- the avatar is sitting,
    // or a viewer is driving it -- and reason says which.
    REFUSED = 5;
  }
  State state = 1;
  string reason = 2;

  // Position is where the avatar is, and exact whether that is the
  // simulator's own figure for it rather than the whole metres of
  // CoarseLocationUpdate.  It is exact once the region has described the
  // avatar, which is soon after it arrives.
  Vector3 position = 3;
  bool exact = 4;

  // Velocity is in metres a second, as the simulator last said.
  Vector3 velocity = 5;

  // Yaw is which way the avatar faces, as the simulator last said:
  // radians anticlockwise from east, between minus pi and pi.
  float yaw = 6;

  // Remaining is the flat distance still to go.
  float remaining = 7;

  // SinceProgress is how long since the avatar last got stall_distance
  // closer, and elapsed how long the walk has been going.
  uint32 since_progress_ms = 8;
  uint32 elapsed_ms = 9;
}

message FaceRequest {
  string agent = 1;

  // Toward a place in the region, or to a heading in radians
  // anticlockwise from east.
  oneof toward {
    Vector3 target = 2;
    float yaw = 3;
  }
}

message FaceResponse {
  // Yaw is the heading the avatar was given.
  float yaw = 1;
}

message HaltRequest { string agent = 1; }

message PostureRequest { string agent = 1; }

message PostureResponse {
  enum Posture {
    STANDING = 0;
    SITTING_ON_GROUND = 1;
    SITTING_ON_OBJECT = 2;
  }
  Posture posture = 1;
  // The seat, for SITTING_ON_OBJECT: its local id, always, and its uuid
  // when the region has described it to this session.
  uint32 seat_local = 2;
  string seat_id = 3;
}

message HaltResponse {
  // Walking says whether a walk was under way.  The avatar is sent a
  // stop either way.
  bool walking = 1;
}

// ------------------------------------------------------------ presence

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PresenceRequest {
  string agent = 1;

  // Draw distance in metres, which is how far the simulator is asked
  // to describe things.  Zero leaves it as it is; anything else sets
  // it, and the response reports what it ended up as.
  float draw_distance = 2;
}

message PresenceResponse {
  // Where the avatar is, in region coordinates, as last reported by
  // the simulator.  Precise after a teleport or a region entry, and to
  // the nearest metre while walking, which is all
  // CoarseLocationUpdate carries.
  Vector3 position = 1;

  // Where it is looking.
  Vector3 look_at = 2;

  // The camera the simulator is told about.  It follows the avatar.
  Vector3 camera = 3;

  float draw_distance = 4;
  uint64 region_handle = 5;
  string region = 6;

  // The group the avatar is acting as, which a parcel's build and
  // script rights are usually granted to rather than to individuals.
  // It arrives at login and whenever it changes, so a client that
  // attached later would never have heard it.
  string active_group = 7;

  // Every group the avatar has joined, which is what active_group can
  // be chosen from.  It travels for the same reason: the simulator
  // volunteers it shortly after the handshake and again whenever it
  // changes, so a client that attached later has no way to ask for it.
  //
  // Empty means "not told yet" as much as "belongs to none", and
  // nothing here can tell those apart.
  repeated GroupMembership groups = 8;

  // The highest rating of land this avatar has asked to be shown, and
  // the highest the account is permitted to ask for: the maturity
  // PREFERENCE and CEILING, as the grid spells them -- "PG", "M" or
  // "A".
  //
  // They travel for the reason active_group does.  Both arrive in the
  // login response, which only the daemon ever saw, and no message
  // repeats them; the capability that changes the preference answers
  // only "set it to this".  So a client that attached later has no
  // question it can ask to hear either one.
  //
  // The preference is the login's until a request through this
  // daemon changes it, and then it is what that request was granted.
  // A change made anywhere else -- the account's web page, or a viewer
  // attached here, which talks to the capability directly -- is not
  // seen.
  //
  // Empty means the login response did not say, and nothing more.
  string maturity_preference = 9;
  string maturity_ceiling = 10;

  // The controls scripts have taken of the avatar with llTakeControls,
  // as the bits of AGENT_CONTROL_*: taken and not passed on, which go
  // to the script and not to the avatar, and taken and passed on, which
  // go to both.  Counted as the viewer counts them, from the session's
  // start, so a client that attached later is told what it could not
  // have heard.  Zero is none.
  uint32 script_controls_taken = 11;
  uint32 script_controls_passed_on = 12;

  // The avatar's health as the last HealthMessage said it, 0 to 100,
  // and whether any has come: a region with damage enabled sends one,
  // and a session that has heard none is not at full health, it is
  // not told.
  float health = 13;
  bool health_known = 14;
}

// GroupMembership is one of the avatar's groups, as
// AgentGroupDataUpdate describes it.
message GroupMembership {
  string id = 1;
  string name = 2;

  // What this membership is allowed to do, as the bitfield the
  // simulator sends.  Nothing here interprets it; it crosses so that a
  // client which wants to can.
  uint64 powers = 3;
}

// --------------------------------------------------------- attachments

message AttachmentsRequest {
  string agent = 1;

  // Whose.  Empty is the agent's own avatar; any other avatar the
  // session has seen can be asked about too.
  string avatar = 2;
}

message AttachmentsResponse {
  // Whether an appearance has been heard for this avatar at all since
  // the session arrived in the region.  False is "not told", not
  // "wearing nothing".
  bool known = 1;

  // The Current Outfit folder version the appearance was baked from.
  // When it matches the folder's version now, the list is current; a
  // change to the outfit that has not been baked since leaves them
  // apart.
  int32 cof_version = 2;

  // When the appearance arrived, in Unix microseconds.
  int64 received_at = 3;

  // Everything attached, as the simulator listed it.  HUDs are not in
  // it: measured on Agni, not even in the copy an avatar is sent about
  // itself.
  repeated SimAttachment attachments = 4;
}

// SimAttachment is one entry in an avatar's attachment list.
message SimAttachment {
  // The attached object: the object, not the inventory item it came
  // from, so it is new every time the thing is worn.  Empty is an
  // attachment the simulator lists as pending on this point without
  // an object yet.
  string object_id = 1;

  // The attachment point, as the simulator numbers them.
  uint32 point = 2;
}

// ------------------------------------------------------------- objects

message ObjectsRequest {
  string agent = 1;

  // Named, if set, returns only objects with this name.  A name is
  // only known if something has asked for it, so an object whose name
  // has never been requested does not match anything.
  string named = 2;

  // Id, if set, returns just that object.
  string id = 3;
}

message ObjectInfo {
  string id = 1;
  uint32 local = 2;

  // Parent is the local id of the root this is linked under, zero for
  // a root.
  uint32 parent = 3;

  // Pcode is 9 for a prim and 47 for an avatar.
  uint32 pcode = 4;

  Vector3 scale = 5;
  Vector3 position = 6;

  // Name is empty until something has asked for it.  Owner is filled
  // in by a compressed update as well as by asking.
  string name = 7;
  string owner = 8;

  // TextureEntry is the packed per face appearance, as the last update
  // that carried one said it.
  bytes texture_entry = 9;

  // Text is the floating text above the object.
  string text = 10;

  // Where a worn object is attached, and the inventory item it was
  // worn from; both zero when it is not worn.
  //
  // The item is the only stable name a worn object has: it is rezzed
  // afresh, with a new id, every time it is put on and every time the
  // avatar logs in. A program that wants to find the same attachment
  // twice must look for the item it came from, and must ask whoever
  // was connected when it was described -- which is this server.
  uint32 attach_point = 11;
  string attach_item = 12;

  // Rotation, and the prim's form.
  //
  // Both arrive with every update and neither can be asked for
  // afterwards, so a client that wants to describe an object as it
  // stands has to be told them by whoever was listening.
  Quaternion rotation = 13;
  PrimShape shape = 14;

  // TextureAnim is the texture animation, still packed, as the last
  // full or compressed update said it; empty when it said none.
  bytes texture_anim = 15;

  // The click action byte, and whether an update said it: zero is the
  // touch action, so click 0 with click_known false means none has.
  uint32 click = 16;
  bool click_known = 17;

  // The sculpt or mesh marker from the extra parameters: the kind
  // (1 to 4 the sculpt types, 5 mesh, 6 glTF) and the texture or asset
  // id. Kind 0 is neither, and then the id is empty.
  uint32 sculpt_kind = 18;
  string sculpt_id = 19;

  // The viewer's link number: 0 not linked, 1 the root of a linkset
  // with children, 2 and up a child by its place in the root's list.
  // Why: doc/objects.md#link-numbers
  uint32 link_number = 20;

  // Whether link_number can be believed: true for a prim that is not
  // linked, and for the rest the state of its linkset, which a link made
  // while the daemon watched leaves unknown.
  // Why: doc/objects.md#link-numbers
  bool link_known = 21;
}

// Quaternion is a rotation, unpacked: the wire form is three floats
// with the fourth recovered by normalising, and this is after that.
message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// PrimShape is what gives a prim its form, in the protocol's own packed
// units rather than anything a person would recognise.  Unpacking them
// is sl.UnpackShape's business, and doing it here would put the same
// arithmetic in two places.
message PrimShape {
  uint32 path_curve = 1;
  uint32 profile_curve = 2;
  uint32 path_begin = 3;
  uint32 path_end = 4;
  uint32 path_scale_x = 5;
  uint32 path_scale_y = 6;
  uint32 path_shear_x = 7;
  uint32 path_shear_y = 8;
  int32 path_twist = 9;
  int32 path_twist_begin = 10;
  int32 path_radius_offset = 11;
  int32 path_taper_x = 12;
  int32 path_taper_y = 13;
  uint32 path_revolutions = 14;
  int32 path_skew = 15;
  uint32 profile_begin = 16;
  uint32 profile_end = 17;
  uint32 profile_hollow = 18;
}

message ObjectsResponse {
  repeated ObjectInfo objects = 1;

  // Known is how many objects the session has heard about in total,
  // which is what the filtered list was drawn from.
  int32 known = 2;
}

// -------------------------------------------------------------- region

message RegionRequest { string agent = 1; }

message RegionInfo {
  string id = 1;
  uint64 handle = 2;
  string name = 3;

  uint32 flags = 4;
  uint64 flags_extended = 5;

  // Access is the maturity rating; owner is the estate owner.
  uint32 access = 6;
  string owner = 7;
  bool estate_manager = 8;

  float water_height = 9;

  string product_name = 10;
  string product_sku = 11;
  string colo_name = 12;
  int32 cpu_class = 13;
  int32 cpu_ratio = 14;
  uint64 protocols = 15;

  // Known is false until the handshake has arrived.
  bool known = 16;

  // Object_capacity is how many prims the region holds, which comes in
  // SimStats rather than the handshake, and is zero until one has.
  uint32 object_capacity = 17;
}

message SimStatsRequest { string agent = 1; }

message SimStatsResponse {
  // Handle is the region the samples are of, the one the avatar is in.
  uint64 handle = 1;

  // Samples are the simulator's reports, oldest first.
  repeated SimStatsSample samples = 2;
}

message SimStatsSample {
  // Age_ms is how long before this answer the report arrived: an age
  // rather than a time, so that a client need not share the daemon's
  // clock.
  int64 age_ms = 1;

  repeated SimStat stats = 2;
}

// SimStat is one statistic: its number, the viewer's ESimStatID, and
// its value.
message SimStat {
  uint32 id = 1;
  float value = 2;
}

// ---------------------------------------------------------------- land

message LandRequest { string agent = 1; }

message LandInfo {
  // The parcel the session was pushed when it arrived, if this region
  // has pushed one.  Known is false where nothing has been heard --
  // which is the ordinary case for a session that has been standing
  // still since before the daemon attached to it.
  bool parcel_known = 1;
  string parcel_name = 2;
  int32 parcel_local_id = 3;

  // The region's parcel overlay: 4096 bytes, one for each 4 metre
  // square.  Quarters is a bitmask of which of the four packets
  // arrived, bit n for packet n -- a count would not do, because the
  // squares of a packet that never arrived are zero, which reads as
  // public land, and which quarter is missing is what says where that
  // reading may not be trusted.
  bytes overlay = 4;
  uint32 overlay_quarters = 5;
}

message GroundRequest {
  string agent = 1;

  // The rectangle asked about, in metres from the region's south west
  // corner.  A point is a rectangle with no area: west equal to east
  // and south to north.
  float west = 2;
  float south = 3;
  float east = 4;
  float north = 5;
}

message GroundResponse {
  // Known is false where any of the land under the rectangle has not
  // arrived, or the rectangle reaches outside the region, and height is
  // then zero.
  bool known = 1;

  // Height is the ground at the point, or the highest it comes in the
  // rectangle, in metres.
  float height = 2;
}

message NeighboursRequest {
  string agent = 1;

  // Set turns the child circuits on or off.  Absent asks without
  // changing anything.
  //
  // Optional, so that the field has presence: "leave it alone" and
  // "turn it off" are different requests and a plain bool spells them
  // the same way.  Presence sets its draw distance from zero for want
  // of this, which works there because no one wants a draw distance of
  // zero and does not work here.
  optional bool set = 2;
}

message NeighboursResponse {
  // On is whether this session takes the offers up.  It can be true
  // with nothing held: a simulator offers a neighbour when the avatar
  // is near one, and offers none at all to an avatar in the middle of a
  // region.
  bool on = 1;

  repeated NeighbourInfo neighbours = 2;
}

// NeighbourInfo is one region the session holds a circuit to and what it
// has of it: a region beside the one the avatar is in, or beside one it
// has left, since a circuit is kept across a move until the simulator
// lets it go.
message NeighbourInfo {
  // Handle is the region's place on the grid, which the square is
  // worked out from.
  uint64 handle = 1;

  // Address is where the offer said the simulator was.
  string address = 2;

  // Name is what the region called itself in its handshake, and is
  // empty for a circuit that has not been answered.
  string name = 3;

  // Handshook says the simulator answered.  An address that never does
  // is an offer that came to nothing, which is worth being able to
  // see.
  bool handshook = 4;

  // Heard is how many packets have arrived on the circuit.  A
  // neighbour describes itself fully and unprompted, so a circuit that
  // is working counts up on its own.
  uint64 heard = 5;
}

message FriendsRequest { string agent = 1; }

message Friend {
  string id = 1;

  // Online is what the last notification said.  It is false for a
  // friend nobody has said anything about, which is the same answer as
  // a friend known to be logged out -- the grid does not distinguish
  // them either.
  bool online = 2;

  // Rights are bit masks: 1 see me online, 2 see me on the map, 4 edit
  // my objects.  Given is what this avatar granted the friend, has is
  // what the friend granted back.  Both are zero for a friendship
  // formed during the session, which arrives as a notification rather
  // than in the login response.
  int32 rights_given = 3;
  int32 rights_has = 4;
}

message FriendsResponse { repeated Friend friends = 1; }

message NoteFriendRequest {
  string agent = 1;

  // Id is the new friend.  Online is what the client knows: somebody
  // whose offer was just accepted, or who just accepted ours, was
  // logged in a moment ago.
  string id = 2;
  bool online = 3;
}

message NoteFriendResponse {}

message FlushRequest { string agent = 1; }

message FlushResponse {
  // Forgotten is how many objects the cache held.
  int32 forgotten = 1;
}
