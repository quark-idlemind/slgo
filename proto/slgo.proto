syntax = "proto3";

// Package slgo.v1 is the link between a server holding grid connections
// and the clients attached to it.
//
// The division is that the server owns whatever breaks if a client
// restarts -- the circuit, its sequence numbers, retransmission,
// acknowledgements, the login and the capability URLs -- and nothing
// else.  It does not decode message bodies, hold an inventory,
// understand chat or know what a script is.
//
// A grid message crosses as its number and its undecoded bytes, so the
// server relays a message type it has never heard of and a client can
// be restarted as often as you like without the grid noticing.
package slgo.v1;

option go_package = "slgo/proto/slgov1";

service Grid {
  // Stream is the packet channel.  The client sends messages to put on
  // the circuit and receives the ones it has subscribed to.  Nothing
  // that is not a grid packet belongs here.
  rpc Stream(stream ClientPacket) returns (stream ServerPacket);

  // Everything below is the server answering for itself rather than
  // relaying the grid.

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);

  // Presence reads where the avatar is and what it can see, and can
  // change the draw distance.
  //
  // Both belong to the server.  AgentUpdate is what puts a session in
  // the simulator's interest list, it has to keep being sent, and the
  // interest list is worked out from the camera rather than from where
  // the avatar is -- so a client that owned this would empty the
  // interest list for every other client by exiting.  A client can ask
  // what it is and ask for it to be changed; it cannot hold it.
  rpc Presence(PresenceRequest) returns (PresenceResponse);

  // Objects is what the region has told the session about itself.
  //
  // The server holds this for the same reason it holds the camera: a
  // region describes itself once, when the avatar arrives, and a
  // client that attaches a minute later is never told any of it.  The
  // server was there to hear it, so the server remembers.  It still
  // has no idea what any of the objects are for.
  rpc Objects(ObjectsRequest) returns (ObjectsResponse);

  // Region is what the simulator said about itself in the handshake,
  // which happens once, before any client is listening.
  rpc Region(RegionRequest) returns (RegionInfo);

  // Flush empties the object cache.
  //
  // It is done automatically when the region changes, since everything
  // cached then describes somewhere else.  This is for a client that
  // knows the cache is wrong for a reason the server cannot see.
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Cap makes an HTTP request against one of the agent's
  // capabilities.  The server holds the URLs and does the request; it
  // has no idea what any of them mean.  This is what keeps inventory,
  // asset upload and script compilation out of the server.
  rpc Cap(CapRequest) returns (CapResponse);

  // Send puts one message on the circuit without opening a stream, for
  // a client that only wants to say one thing.
  rpc Send(SendRequest) returns (SendResponse);
}

// ------------------------------------------------------------ packets

// ClientPacket is a message the client wants put on the circuit, or the
// opening frame naming the agent to attach to.
message ClientPacket {
  oneof body {
    Attach attach = 1;
    OutboundMessage message = 2;

    // Which messages to relay is state of this stream, so it is
    // adjusted on the stream rather than by an RPC that would have no
    // way to say which stream it meant.
    Subscribe subscribe = 3;
  }
}

// Subscribe adjusts what this stream relays.  Exactly one field is
// used: set replaces the subscription, add and remove adjust it.
message Subscribe {
  repeated string set = 1;
  repeated string add = 2;
  repeated string remove = 3;
}

// Attach must be the first frame on a stream.
message Attach {
  string agent = 1;

  // Messages to relay, by template name.  "*" means everything.  Empty
  // means nothing until Subscribe says otherwise, which is the default
  // because a busy region will otherwise flood the link.
  repeated string subscribe = 2;
}

message OutboundMessage {
  // The message number, as slgo's msg.ID.  Name may be given instead
  // and is looked up in the template.
  uint32 id = 1;
  string name = 2;

  // The encoded message body, without the packet header or the message
  // number.  The server frames it: sequence numbers and reliability
  // are circuit state and are not the client's to choose.
  bytes body = 3;
  bool reliable = 4;
}

// ServerPacket is a message that arrived from the simulator, or a note
// about the connection.
message ServerPacket {
  oneof body {
    InboundMessage message = 1;
    Attached attached = 2;

    // A note about the grid connection itself: it went away, it came
    // back.  Not grid traffic.
    AgentEvent notice = 3;

    // Something that arrived on the event queue rather than the UDP
    // circuit.  Its body is LLSD, not the binary message encoding, so
    // it cannot share InboundMessage.
    InboundEvent event = 4;
  }
}

// InboundEvent is one entry from EventQueueGet.
//
// The queue carries what UDP no longer does: ParcelProperties,
// TeleportFinish, EstablishAgentCommunication and the rest.  A poll
// must be kept running continuously and its sequence acknowledged, so
// it belongs on the server for the same reason the circuit does -- a
// client restart would lose the sequence and drop events.
message InboundEvent {
  // The event name, as the queue gives it.  Some match a template
  // message and some have no UDP equivalent at all.
  string message = 1;

  // The event body, LLSD encoded.  The server does not look inside.
  bytes body = 2;

  int64 received_at = 3;
}

message Attached {
  AgentInfo agent = 1;
}

message InboundMessage {
  uint32 id = 1;

  // The template's name for the message, empty when the number is not
  // in this server's template.  The body is relayed either way.
  string name = 2;

  bytes body = 3;
  uint32 sequence = 4;
  uint32 flags = 5;

  // Microseconds since the epoch, when the datagram was read.
  int64 received_at = 6;
}

// AgentEvent is something that happened to the grid connection itself.
message AgentEvent {
  enum Kind {
    UNKNOWN = 0;
    REGION_CHANGED = 1;
    DISCONNECTED = 2;
    KICKED = 3;
  }
  Kind kind = 1;
  string detail = 2;
}

// ------------------------------------------------------------ control

message AgentInfo {
  string name = 1; // the profile name the server hosts it under
  string agent_id = 2;
  string session_id = 3;
  string avatar_name = 4;
  string region = 5;
  string channel_version = 6;
  string inventory_root = 7;
  repeated string caps = 8;
  bool connected = 9;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message StatusRequest {
  string agent = 1;
}

message StatusResponse {
  AgentInfo agent = 1;

  uint64 packets_in = 2;
  uint64 packets_out = 3;
  uint64 bytes_in = 4;
  uint64 bytes_out = 5;
  uint64 resent = 6;
  uint64 abandoned = 7;
  uint64 duplicates = 8;
  uint64 undecodable = 9;
  uint64 unknown_messages = 10;
  int32 clients = 11;

  // Messages nobody has registered for, by template name.  This is how
  // a protocol change announces itself.
  map<string, uint64> unhandled = 12;
}

message CapRequest {
  string agent = 1;
  string cap = 2;    // capability name, e.g. "InventoryAPIv3"
  string method = 3; // default GET
  string path = 4;   // appended to the capability URL
  bytes body = 5;
  string content_type = 6;

  // An absolute URL to use instead of a named capability.
  //
  // Asset upload needs this: the first step posts to a capability and
  // the simulator answers with a one-shot uploader URL to post the
  // bytes to.  Without it a client would have to reach the simulator
  // itself, which is exactly the coupling the server exists to avoid.
  //
  // Only URLs the simulator has handed us are accepted, so this cannot
  // be used to make the server fetch something arbitrary.
  string url = 7;
}

message CapResponse {
  int32 status = 1;
  bytes body = 2;
}

message SendRequest {
  string agent = 1;
  OutboundMessage message = 2;
}

message SendResponse {}

// ------------------------------------------------------------ presence

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PresenceRequest {
  string agent = 1;

  // Draw distance in metres, which is how far the simulator is asked
  // to describe things.  Zero leaves it as it is; anything else sets
  // it, and the response reports what it ended up as.
  float draw_distance = 2;
}

message PresenceResponse {
  // Where the avatar is, in region coordinates, as last reported by
  // the simulator.  Precise after a teleport or a region entry, and to
  // the nearest metre while walking, which is all
  // CoarseLocationUpdate carries.
  Vector3 position = 1;

  // Where it is looking.
  Vector3 look_at = 2;

  // The camera the simulator is told about.  It follows the avatar.
  Vector3 camera = 3;

  float draw_distance = 4;
  uint64 region_handle = 5;
  string region = 6;

  // The group the avatar is acting as, which a parcel's build and
  // script rights are usually granted to rather than to individuals.
  // It arrives at login and whenever it changes, so a client that
  // attached later would never have heard it.
  string active_group = 7;
}

// ------------------------------------------------------------- objects

message ObjectsRequest {
  string agent = 1;

  // Named, if set, returns only objects with this name.  A name is
  // only known if something has asked for it, so an object whose name
  // has never been requested does not match anything.
  string named = 2;

  // Id, if set, returns just that object.
  string id = 3;
}

message ObjectInfo {
  string id = 1;
  uint32 local = 2;

  // Parent is the local id of the root this is linked under, zero for
  // a root.
  uint32 parent = 3;

  // Pcode is 9 for a prim and 47 for an avatar.
  uint32 pcode = 4;

  Vector3 scale = 5;
  Vector3 position = 6;

  // Name is empty until something has asked for it.  Owner is filled
  // in by a compressed update as well as by asking.
  string name = 7;
  string owner = 8;

  // TextureEntry is the packed per face appearance, when one has been
  // seen.  It usually arrives only in a compressed update.
  bytes texture_entry = 9;

  // Text is the floating text above the object.
  string text = 10;
}

message ObjectsResponse {
  repeated ObjectInfo objects = 1;

  // Known is how many objects the session has heard about in total,
  // which is what the filtered list was drawn from.
  int32 known = 2;
}

// -------------------------------------------------------------- region

message RegionRequest { string agent = 1; }

message RegionInfo {
  string id = 1;
  uint64 handle = 2;
  string name = 3;

  uint32 flags = 4;
  uint64 flags_extended = 5;

  // Access is the maturity rating; owner is the estate owner.
  uint32 access = 6;
  string owner = 7;
  bool estate_manager = 8;

  float water_height = 9;

  string product_name = 10;
  string product_sku = 11;
  string colo_name = 12;
  int32 cpu_class = 13;
  int32 cpu_ratio = 14;
  uint64 protocols = 15;

  // Known is false until the handshake has arrived.
  bool known = 16;
}

message FlushRequest { string agent = 1; }

message FlushResponse {
  // Forgotten is how many objects the cache held.
  int32 forgotten = 1;
}
